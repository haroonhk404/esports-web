<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — AU PUBG Tournament</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="auth.css">
  <script src="theme.js" defer></script>
  <script src="wallet.js" defer></script>
</head>
<body>

  <!-- ===== NAV ===== -->
  <nav>
      <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="25" r="22" stroke="#f2a900" stroke-width="2"/>
          <circle cx="25" cy="25" r="14" stroke="#f2a900" stroke-width="1.5"/>
          <circle cx="25" cy="25" r="3" fill="#c8102e"/>
          <line x1="25" y1="0" x2="25" y2="14" stroke="#f2a900" stroke-width="2"/>
          <line x1="25" y1="36" x2="25" y2="50" stroke="#f2a900" stroke-width="2"/>
          <line x1="0" y1="25" x2="14" y2="25" stroke="#f2a900" stroke-width="2"/>
          <line x1="36" y1="25" x2="50" y2="25" stroke="#f2a900" stroke-width="2"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="l1">AU PUBG</span>
        <span class="l2">CHAMPIONSHIP SERIES</span>
      </div>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Battleground</a></li>
      <li><a href="players.html">Players</a></li>
      <li><a href="tournaments.html">Tournaments</a></li>
      <li><a href="leaderboard.html">Standings</a></li>
      <li><a href="maps.html">Maps</a></li>
      <li><a href="register.html">Enlist</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <button class="theme-toggle-btn" id="themeToggle" title="Toggle theme">🌙</button>
      <a href="login.html" class="nav-account-btn" id="navAccountBtn">LOGIN</a>
      <button class="wallet-btn" id="walletBtn">
        <span class="dot"></span>
        <span id="walletText">CONNECT WALLET</span>
      </button>
    </div>
  </nav>

  <!-- ===== SIGNUP CARD ===== -->
  <section class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tag">// CREATE ACCOUNT</div>
      <h1 class="auth-title">Join the Battle</h1>
      <p class="auth-sub">Register your profile to track stats, manage squads, and enlist in tournaments.</p>

      <div class="auth-error" id="signupError"></div>
      <div class="auth-success" id="signupSuccess"></div>

      <form class="auth-form" id="signupForm">
        <div class="auth-row">
          <div class="auth-field">
            <label for="username">Username *</label>
            <input type="text" id="username" required minlength="3" maxlength="50" placeholder="shadowx">
          </div>
          <div class="auth-field">
            <label for="ign">In-Game Name</label>
            <input type="text" id="ign" maxlength="50" placeholder="ShadowX_TR">
          </div>
        </div>

        <div class="auth-field">
          <label for="email">Email Address *</label>
          <input type="email" id="email" required placeholder="soldier@email.com">
        </div>

        <div class="auth-field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" maxlength="100" placeholder="Ali Raza">
        </div>

        <div class="auth-row">
          <div class="auth-field">
            <label for="password">Password *</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="auth-field">
            <label for="region">Region</label>
            <select id="region">
              <option value="PK">🇵🇰 Pakistan</option>
              <option value="IN">🇮🇳 India</option>
              <option value="BD">🇧🇩 Bangladesh</option>
              <option value="LK">🇱🇰 Sri Lanka</option>
              <option value="NP">🇳🇵 Nepal</option>
            </select>
          </div>
        </div>

        <button type="submit" class="auth-submit" id="signupBtn">
          <span id="signupBtnText">CREATE ACCOUNT</span>
        </button>

        <div class="auth-alt">
          Already have an account?<a href="login.html">Sign In</a>
        </div>
      </form>
    </div>
  </section>

  <script>
    const form = document.getElementById('signupForm');
    const err = document.getElementById('signupError');
    const success = document.getElementById('signupSuccess');
    const btn = document.getElementById('signupBtn');
    const btnText = document.getElementById('signupBtnText');

    function showError(msg) {
      err.innerText = msg;
      err.classList.add('show');
      success.classList.remove('show');
    }
    function showSuccess(msg) {
      success.innerText = msg;
      success.classList.add('show');
      err.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      success.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const ign      = document.getElementById('ign').value.trim();
      const region   = document.getElementById('region').value;

      // Client-side validation
      if (username.length < 3) return showError('Username must be at least 3 characters.');
      if (password.length < 6) return showError('Password must be at least 6 characters.');
      if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) return showError('Please enter a valid email.');

      btn.disabled = true;
      btnText.innerText = 'CREATING ACCOUNT...';

      try {
        const res = await fetch('https://aupubg.rf.gd/https://aupubg.rf.gd/backend/signup.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, fullName, ign, region })
        });
        const data = await res.json();

        if (data.success) {
          showSuccess('Account created! Redirecting to login...');
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          showError(data.error || 'Signup failed.');
          btn.disabled = false;
          btnText.innerText = 'CREATE ACCOUNT';
        }
      } catch (ex) {
        showError('Backend not reachable. Make sure XAMPP is running.');
        btn.disabled = false;
        btnText.innerText = 'CREATE ACCOUNT';
      }
    });
  </script>
</body>
</html>
